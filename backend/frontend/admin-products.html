<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Products | LoanWise AI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="lw-layout">
  <div id="sidebarOverlay" class="lw-sidebar-overlay"></div>
  <aside id="lwSidebar" class="lw-sidebar"></aside>
  <div class="lw-main">
    <header id="lwTopbar" class="lw-topbar"></header>
    <main class="lw-page-content">
      <div class="lw-breadcrumb"><a href="admin-dashboard.html">Admin</a> / Products</div>
      <h1 class="lw-page-title">Loan Product Management</h1>
      <div id="prodMgmtAlert"></div>
      <div class="la-card mb-3">
        <div class="row g-3">
          <div class="col-md-4"><input type="text" class="form-control" id="prodSearch" placeholder="🔍 Search product or lender..."></div>
          <div class="col-md-3"><select class="form-select" id="prodCatFilter">
            <option value="">All Categories</option>
            <option>Personal Loan</option><option>Home Loan</option><option>Vehicle Loan</option>
            <option>Education Loan</option><option>Gold Loan</option><option>Business Loan</option>
            <option>Consumer Durable Loan</option>
          </select></div>
          <div class="col-md-3"><select class="form-select" id="prodStatusFilter"><option value="">All Status</option><option value="true">Active</option><option value="false">Inactive</option></select></div>
        </div>
      </div>
      <div class="la-card"><div class="table-responsive"><table class="lw-table">
        <thead><tr><th>Lender</th><th>Product Name</th><th>Category</th><th>Amount Range</th><th>Rate</th><th>Verification</th><th>Active</th><th>Actions</th></tr></thead>
        <tbody id="adminProductsBody"><tr><td colspan="8" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm spinner-la"></span></td></tr></tbody>
      </table></div></div>
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script><script src="js/admin.js"></script>
<script>$(function(){ initAdminProductsPage(); });</script>
</body></html>
