<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search Loans — LoanWise AI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="lw-layout">
  <div id="sidebarOverlay" class="lw-sidebar-overlay"></div>
  <aside id="lwSidebar" class="lw-sidebar"></aside>
  <div class="lw-main">
    <header id="lwTopbar" class="lw-topbar"></header>
    <main class="lw-page-content">
      <div class="lw-breadcrumb"><a href="dashboard.html">Dashboard</a> / Search Loans</div>
      <h1 class="lw-page-title">Search Loan Products</h1>
      <p class="lw-page-subtitle">Search by lender name, product name, category or purpose.</p>

      <div class="la-card mb-4">
        <form id="searchForm">
          <div class="row g-3">
            <div class="col-md-8">
              <input type="text" class="form-control form-control-lg" id="searchInput"
                placeholder="e.g. SBI, Personal Loan, Education Loan, HDFC...">
            </div>
            <div class="col-md-4">
              <button type="submit" class="btn btn-la-primary btn-lg w-100">🔍 Search</button>
            </div>
          </div>
          <div class="mt-3 d-flex flex-wrap gap-2">
            <span class="text-muted small fw-bold me-2">Quick filters:</span>
            <button type="button" class="btn btn-sm btn-la-outline quick-filter" data-q="Personal Loan">Personal Loan</button>
            <button type="button" class="btn btn-sm btn-la-outline quick-filter" data-q="Home Loan">Home Loan</button>
            <button type="button" class="btn btn-sm btn-la-outline quick-filter" data-q="Vehicle Loan">Vehicle Loan</button>
            <button type="button" class="btn btn-sm btn-la-outline quick-filter" data-q="Education Loan">Education Loan</button>
            <button type="button" class="btn btn-sm btn-la-outline quick-filter" data-q="Business Loan">Business Loan</button>
            <button type="button" class="btn btn-sm btn-la-outline quick-filter" data-q="Gold Loan">Gold Loan</button>
            <button type="button" class="btn btn-sm btn-la-outline quick-filter" data-q="SBI">SBI</button>
            <button type="button" class="btn btn-sm btn-la-outline quick-filter" data-q="HDFC">HDFC</button>
            <button type="button" class="btn btn-sm btn-la-outline quick-filter" data-q="ICICI">ICICI</button>
          </div>
        </form>
      </div>

      <div id="searchAlert"></div>
      <div id="searchResults">
        <div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-msg">Enter a search term above to find loan products.</div></div>
      </div>
    </main>
    <footer class="la-footer text-center"><div class="container"><p class="mb-0 small">LoanWise AI — Search results from live MongoDB catalogue.</p></div></footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/loans.js"></script>
<script>$(function(){ initLoanSearchPage(); });</script>
</body>
</html>
