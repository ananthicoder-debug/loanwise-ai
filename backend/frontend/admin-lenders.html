<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Lenders | LoanWise AI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="lw-layout">
  <div id="sidebarOverlay" class="lw-sidebar-overlay"></div>
  <aside id="lwSidebar" class="lw-sidebar"></aside>
  <div class="lw-main">
    <header id="lwTopbar" class="lw-topbar"></header>
    <main class="lw-page-content">
      <div class="lw-breadcrumb"><a href="admin-dashboard.html">Admin</a> / Lenders</div>
      <h1 class="lw-page-title">Lender Management</h1>
      <div id="lenderMgmtAlert"></div>
      <div class="mb-3"><button class="btn btn-la-primary" data-bs-toggle="modal" data-bs-target="#addLenderModal">+ Add Lender</button></div>
      <div class="la-card"><div class="table-responsive"><table class="lw-table">
        <thead><tr><th>Code</th><th>Lender Name</th><th>Type</th><th>City</th><th>Website</th><th>Products</th><th>Verification</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="adminLendersBody"><tr><td colspan="9" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm spinner-la"></span></td></tr></tbody>
      </table></div></div>
    </main>
  </div>
</div>
<div class="modal fade" id="addLenderModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Add Lender</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div id="addLenderAlert"></div>
      <div class="mb-2"><label class="form-label">Lender Name</label><input class="form-control" id="newLenderName" required></div>
      <div class="mb-2"><label class="form-label">Type</label><select class="form-select" id="newLenderType"><option value="Bank">Bank</option><option value="NBFC">NBFC</option><option value="Cooperative">Cooperative</option></select></div>
      <div class="mb-2"><label class="form-label">Official Website</label><input class="form-control" id="newLenderWebsite" placeholder="https://..."></div>
      <div class="mb-2"><label class="form-label">City</label><input class="form-control" id="newLenderCity"></div>
      <div class="mb-2"><label class="form-label">State</label><input class="form-control" id="newLenderState"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-la-primary" id="saveLenderBtn">Save</button></div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script><script src="js/admin.js"></script>
<script>$(function(){ initAdminLendersPage(); });</script>
</body></html>
