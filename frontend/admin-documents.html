<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Document Verification — LoanWise AI Admin</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
.doc-card { background:#fff; border:1px solid var(--border); border-radius:10px; padding:16px 18px; margin-bottom:12px; display:flex; flex-direction:column; gap:8px; }
.doc-icon-wrap { font-size:1.8rem; }
.doc-name { font-weight:700; font-size:.95rem; }
.doc-meta { font-size:.8rem; color:#6B7280; }
.doc-actions { display:flex; align-items:center; gap:8px; }
</style>
</head>
<body>
<div class="lw-layout">
  <div id="sidebarOverlay" class="lw-sidebar-overlay"></div>
  <aside id="lwSidebar" class="lw-sidebar"></aside>
  <div class="lw-main">
    <header id="lwTopbar" class="lw-topbar"></header>
    <main class="lw-page-content">
      <div class="lw-breadcrumb"><a href="admin-dashboard.html">Admin</a> / Document Verification</div>
      <h1 class="lw-page-title">Document Verification</h1>
      <p class="lw-page-subtitle">Review and verify user-uploaded documents to assess loan repayment capability.</p>
      <div id="adminDocsAlert"></div>
      <div id="adminDocSummary"></div>

      <!-- Filter bar -->
      <div class="la-card mb-3">
        <div class="row g-2 align-items-center">
          <div class="col-auto">
            <label class="form-label mb-0 fw-600">Filter by status:</label>
          </div>
          <div class="col-auto">
            <select class="form-select form-select-sm" id="docFilterStatus" onchange="_loadAdminDocuments()">
              <option value="all">All Documents</option>
              <option value="Pending Review">Pending Review</option>
              <option value="Verified">Verified</option>
              <option value="Rejected">Rejected</option>
            </select>
          </div>
          <div class="col-auto ms-auto">
            <button class="btn btn-sm btn-la-outline" onclick="_loadAdminDocuments()">🔄 Refresh</button>
          </div>
        </div>
      </div>

      <div id="adminDocsList">
        <div class="text-center py-5"><span class="spinner-border spinner-la"></span></div>
      </div>
    </main>
    <footer class="la-footer text-center"><div class="container"><p class="mb-0 small">LoanWise AI Admin — Document verification ensures accurate eligibility assessment.</p></div></footer>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/documents.js"></script>
<script>$(function(){ initAdminDocumentsPage(); });</script>
</body>
</html>
