<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment History — LoanWise AI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="lw-layout">
  <div id="sidebarOverlay" class="lw-sidebar-overlay"></div>
  <aside id="lwSidebar" class="lw-sidebar"></aside>
  <div class="lw-main">
    <header id="lwTopbar" class="lw-topbar"></header>
    <main class="lw-page-content">
      <div class="lw-breadcrumb"><a href="dashboard.html">Dashboard</a> / Payment History</div>
      <h1 class="lw-page-title">Payment History</h1>
      <p class="lw-page-subtitle">Track all EMI payments across your active loans.</p>
      <div id="paymentHistAlert"></div>

      <!-- Filters -->
      <div class="la-card mb-4">
        <div class="row g-3 align-items-end">
          <div class="col-md-4">
            <label class="form-label">Filter by Loan</label>
            <select class="form-select" id="filterLoan"><option value="">All Loans</option></select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Filter by Status</label>
            <select class="form-select" id="filterStatus">
              <option value="">All</option>
              <option value="PAID">Paid</option>
              <option value="DUE">Due</option>
              <option value="OVERDUE">Overdue</option>
              <option value="UPCOMING">Upcoming</option>
            </select>
          </div>
          <div class="col-md-3">
            <div id="paymentSummary" class="d-flex flex-wrap gap-2 mt-2"></div>
          </div>
        </div>
      </div>

      <div class="la-card">
        <div class="table-responsive">
          <table class="lw-table">
            <thead>
              <tr><th>EMI #</th><th>Due Date</th><th>EMI Amount</th><th>Amount Paid</th><th>Status</th><th>Payment Date</th><th>Days Late</th><th>Late Charge</th></tr>
            </thead>
            <tbody id="paymentHistBody">
              <tr><td colspan="8" class="text-center py-4 text-muted">Loading payment records...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
    <footer class="la-footer text-center"><div class="container"><p class="mb-0 small">LoanWise AI — Your complete payment history and schedule.</p></div></footer>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/payments.js"></script>
<script>$(function(){ initPaymentHistoryPage(); });</script>
</body>
</html>
