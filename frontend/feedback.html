<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feedback — LoanWise AI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="lw-layout">
  <div id="sidebarOverlay" class="lw-sidebar-overlay"></div>
  <aside id="lwSidebar" class="lw-sidebar"></aside>
  <div class="lw-main">
    <header id="lwTopbar" class="lw-topbar"></header>
    <main class="lw-page-content">
      <div class="lw-breadcrumb"><a href="dashboard.html">Dashboard</a> / Feedback</div>
      <h1 class="lw-page-title">Feedback</h1>
      <p class="lw-page-subtitle">Help improve LoanWise AI by sharing your experience.</p>
      <div class="row g-4">
        <div class="col-md-6">
          <div class="la-card">
            <div class="la-card-header">💬 Submit Feedback</div>
            <div id="fbAlert"></div>
            <form id="feedbackForm">
              <div class="mb-3">
                <label class="form-label">Rating</label>
                <div id="starRating" class="d-flex gap-2 fs-2">
                  <span class="star-btn" data-val="1" style="cursor:pointer">⭐</span>
                  <span class="star-btn" data-val="2" style="cursor:pointer">⭐</span>
                  <span class="star-btn" data-val="3" style="cursor:pointer">⭐</span>
                  <span class="star-btn" data-val="4" style="cursor:pointer">⭐</span>
                  <span class="star-btn" data-val="5" style="cursor:pointer">⭐</span>
                </div>
                <input type="hidden" id="ratingVal" value="0">
                <div class="form-text" id="ratingText">Click a star to rate</div>
              </div>
              <div class="mb-3">
                <label class="form-label">Category</label>
                <select class="form-select" id="fbCategory">
                  <option value="General">General</option>
                  <option value="Eligibility">Eligibility Feature</option>
                  <option value="Recommendations">Recommendations</option>
                  <option value="EMI Calculator">EMI Calculator</option>
                  <option value="Product Catalogue">Product Catalogue</option>
                  <option value="UI/UX">UI/UX Design</option>
                  <option value="Bug Report">Bug Report</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Comments</label>
                <textarea class="form-control" id="fbComments" rows="4" placeholder="Your feedback..."></textarea>
              </div>
              <button type="submit" class="btn btn-la-primary w-100">Submit Feedback</button>
            </form>
          </div>
        </div>
        <div class="col-md-6">
          <div class="la-card">
            <div class="la-card-header">📋 My Past Feedback</div>
            <div id="myFeedback"><div class="text-center py-4"><span class="spinner-border spinner-border-sm spinner-la"></span></div></div>
          </div>
        </div>
      </div>
    </main>
    <footer class="la-footer text-center"><div class="container"><p class="mb-0 small">LoanWise AI</p></div></footer>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/notifications.js"></script>
<script>$(function(){ initFeedbackPage(); });</script>
</body>
</html>
